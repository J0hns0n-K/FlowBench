name: Verify research workbench

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Exact numerical tests
        run: pnpm test
      - name: Project overview matches current evidence
        run: pnpm docs:check
      - name: Typecheck and browser build
        run: pnpm build
      - name: Reproduce synthetic sensitivity experiment
        run: pnpm experiment
